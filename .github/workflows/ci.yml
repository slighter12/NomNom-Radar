name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: latest
  TARGETS_FILE: .github/scripts/release/targets.json

jobs:
  checks:
    name: Run checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run release helper checks
        run: bash .github/scripts/release/release_test.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Run linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --config=./.golangci.yaml

      - name: Run tests
        run: go test -race ./...

      - name: Scan dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  candidate-changes:
    name: Detect candidate changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: checks
    outputs:
      candidate: ${{ steps.changes.outputs.candidate }}
      targets: ${{ steps.changes.outputs.targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect release-impacting paths
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: bash .github/scripts/release/release.sh candidate-changes

  publish-candidate:
    name: Publish ${{ matrix.target }} candidate image
    if: needs.candidate-changes.outputs.candidate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: candidate-changes
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.candidate-changes.outputs.targets) }}
    concurrency:
      group: candidate-${{ github.sha }}-${{ matrix.target }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      PROJECT_ID: ${{ vars.GCP_DEV_PROJECT_ID }}
      REGISTRY: ${{ vars.GCP_DEV_REGISTRY }}
      RELEASE_SHA: ${{ github.sha }}
      OWNER: ${{ github.repository_owner }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate candidate registry configuration
        env:
          GCP_CANDIDATE_SA_KEY: ${{ secrets.GCP_CANDIDATE_SA_KEY }}
        run: |
          set -euo pipefail
          for required in PROJECT_ID REGISTRY GCP_CANDIDATE_SA_KEY; do
            if [ -z "${!required:-}" ]; then
              echo "::error::Missing candidate registry configuration: ${required}"
              exit 1
            fi
          done

      - name: Google Auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: "${{ secrets.GCP_CANDIDATE_SA_KEY }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${REGISTRY%%/*}" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and stage candidate image
        id: stage
        run: bash .github/scripts/release/release.sh stage-candidate

      - name: Attest staged image digest
        if: steps.stage.outputs.needs_finalize == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.stage.outputs.owner }}/${{ env.TARGET }}
          subject-digest: ${{ steps.stage.outputs.digest }}

      - name: Verify candidate attestation
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_FINALIZE: ${{ steps.stage.outputs.needs_finalize }}
          IMAGE: ${{ env.REGISTRY }}/${{ steps.stage.outputs.owner }}/${{ env.TARGET }}@${{ steps.stage.outputs.digest }}
        run: |
          set -euo pipefail
          if bash .github/scripts/release/release.sh verify-attestation; then
            exit 0
          fi
          if [ "${NEEDS_FINALIZE}" = false ]; then
            echo "::error::Existing SHA tag for ${TARGET} has no valid attestation; stop and follow the approved manual recovery procedure before retrying."
          else
            echo "::error::Candidate attestation did not become visible for ${TARGET}."
          fi
          exit 1

      - name: Publish verified candidate SHA tag
        env:
          NEEDS_FINALIZE: ${{ steps.stage.outputs.needs_finalize }}
          STAGING_REF: ${{ steps.stage.outputs.staging_ref }}
          STAGED_DIGEST: ${{ steps.stage.outputs.digest }}
        run: bash .github/scripts/release/release.sh finalize-candidate
