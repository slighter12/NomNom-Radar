name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: latest
  TARGETS_FILE: .github/scripts/release/targets.json

jobs:
  checks:
    name: Run checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tests also use host kubectl and fake CLIs. Reuse the action's exact yq
      # binary so local and action rendering exercise the same expressions.
      - name: Provide yq for release helper checks
        uses: mikefarah/yq@c14f446382944492701b16c1ddb48bb9dbe683e3 # v4.53.6; upstream image pinned by digest
        with:
          cmd: mkdir -p .release-tools && cp /usr/bin/yq .release-tools/yq

      - name: Run release helper checks
        run: PATH="${GITHUB_WORKSPACE}/.release-tools:${PATH}" bash .github/scripts/release/release_test.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Run linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --config=./.golangci.yaml

      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@latest -shellcheck=

      - name: Run tests
        run: go test -race ./...

      - name: Scan dependencies
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1; scanner tracks latest
        with:
          repo-checkout: false
          go-package: ./...
          go-version-file: go.mod
          go-version-input: ''
          check-latest: false

  candidate-changes:
    name: Detect candidate changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: checks
    outputs:
      candidate: ${{ steps.changes.outputs.candidate }}
      targets: ${{ steps.changes.outputs.targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect release-impacting paths
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          source .github/scripts/release/candidate.sh
          changed=false
          if [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            changed=true
          elif impact_changed "${BEFORE_SHA}" "${GITHUB_SHA}"; then
            changed=true
          else
            status=$?
            test "${status}" = 1 || exit "${status}"
          fi
          echo "candidate=${changed}" >> "${GITHUB_OUTPUT}"
          echo "targets=$(jq -c '.' "${TARGETS_FILE}")" >> "${GITHUB_OUTPUT}"

  publish-candidate:
    name: Publish ${{ matrix.target }} candidate image
    if: needs.candidate-changes.outputs.candidate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: candidate-changes
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.candidate-changes.outputs.targets) }}
    concurrency:
      group: candidate-${{ github.sha }}-${{ matrix.target }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      PROJECT_ID: ${{ vars.GCP_DEV_PROJECT_ID }}
      REGISTRY: ${{ vars.GCP_DEV_REGISTRY }}
      RELEASE_SHA: ${{ github.sha }}
      OWNER: ${{ github.repository_owner }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate candidate registry configuration
        env:
          GCP_CANDIDATE_SA_KEY: ${{ secrets.GCP_CANDIDATE_SA_KEY }}
        run: |
          set -euo pipefail
          for required in PROJECT_ID REGISTRY GCP_CANDIDATE_SA_KEY; do
            if [ -z "${!required:-}" ]; then
              echo "::error::Missing candidate registry configuration: ${required}"
              exit 1
            fi
          done

      - name: Google Auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: "${{ secrets.GCP_CANDIDATE_SA_KEY }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${REGISTRY%%/*}" --quiet

      - name: Inspect candidate tag
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .github/scripts/release/candidate.sh
          OWNER=$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')
          list_tags "${REGISTRY}" "${PROJECT_ID}" > "${RUNNER_TEMP}/tags.json"
          image=$(candidate_image "${RUNNER_TEMP}/tags.json" "${REGISTRY}" "${TARGET}" "${RELEASE_SHA}")
          echo "image_name=${REGISTRY}/${OWNER}/${TARGET}" >> "${GITHUB_OUTPUT}"
          echo "staging_tag=${REGISTRY}/${OWNER}/${TARGET}:staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${TARGET}" >> "${GITHUB_OUTPUT}"
          echo "existing=${image}" >> "${GITHUB_OUTPUT}"
          if [ -n "${image}" ]; then
            verify_image "${image}" "${RELEASE_SHA}"
          fi

      - name: Set up Docker Buildx
        if: steps.candidate.outputs.existing == ''
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and stage candidate image
        id: build
        if: steps.candidate.outputs.existing == ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          pull: true
          provenance: false
          sbom: false
          push: true
          tags: ${{ steps.candidate.outputs.staging_tag }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Attest staged image digest
        if: steps.candidate.outputs.existing == ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.candidate.outputs.image_name }}
          subject-digest: ${{ steps.build.outputs.digest }}

      - name: Verify and publish candidate tag
        if: steps.candidate.outputs.existing == ''
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ steps.candidate.outputs.image_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          source .github/scripts/release/candidate.sh
          verify_image "${IMAGE_NAME}@${DIGEST}" "${RELEASE_SHA}"
          list_tags "${REGISTRY}" "${PROJECT_ID}" > "${RUNNER_TEMP}/tags.json"
          existing=$(candidate_image "${RUNNER_TEMP}/tags.json" "${REGISTRY}" "${TARGET}" "${RELEASE_SHA}")
          test -z "${existing}" || test "${existing}" = "${IMAGE_NAME}@${DIGEST}"
          gcloud artifacts docker tags add "${IMAGE_NAME}@${DIGEST}" "${IMAGE_NAME}:${RELEASE_SHA:0:7}" --project="${PROJECT_ID}" --quiet
          list_tags "${REGISTRY}" "${PROJECT_ID}" > "${RUNNER_TEMP}/tags.json"
          final=$(candidate_image "${RUNNER_TEMP}/tags.json" "${REGISTRY}" "${TARGET}" "${RELEASE_SHA}")
          test "${final}" = "${IMAGE_NAME}@${DIGEST}"
          short_image=$(tag_digest "${RUNNER_TEMP}/tags.json" "${REGISTRY}" "${TARGET}" "${RELEASE_SHA:0:7}")
          test "${short_image}" = "${IMAGE_NAME}@${DIGEST}"
