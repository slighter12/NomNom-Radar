name: Release Cloud Run

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, prod]
      release_ref:
        description: "Candidate SHA or vX.Y.Z. Required for prod; empty selects latest for dev."
        required: false
        default: ""
        type: string
      run_migrations:
        description: "Apply the selected candidate's pending migrations before deployment."
        required: false
        default: false
        type: boolean
      retry_run_id:
        description: "Failed release run to retry with the same digests; cannot combine with release_ref."
        required: false
        default: ""
        type: string

jobs:
  release:
    name: Release current candidate to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ inputs.environment }}
    concurrency:
      group: cloud-run-release
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      attestations: read
      actions: read
    env:
      CONTROL_SHA: ${{ github.sha }}
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      RELEASE_REF: ${{ inputs.release_ref }}
      RUN_MIGRATIONS: ${{ inputs.run_migrations }}
      RETRY_RUN_ID: ${{ inputs.retry_run_id }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      REGION: ${{ vars.GCP_REGION }}
      REGISTRY: ${{ vars.GCP_REGISTRY }}
      RUNTIME_SA_EMAIL: ${{ vars.GCP_SA_EMAIL }}
      ALLOWED_HOST: ${{ vars.HTTP_ALLOWEDHOST }}
      CORS_ALLOWED_ORIGINS: ${{ vars.HTTP_CORSALLOWEDORIGINS }}
      RATE_LIMIT_ENABLED: ${{ vars.HTTP_RATELIMIT_ENABLED }}
      RATE_LIMIT_RATE: ${{ vars.HTTP_RATELIMIT_RATE }}
      RATE_LIMIT_BURST: ${{ vars.HTTP_RATELIMIT_BURST }}
      RATE_LIMIT_EXPIRES_IN: ${{ vars.HTTP_RATELIMIT_EXPIRESIN }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLEOAUTH_CLIENTID }}
      DEV_PROJECT_ID: ${{ vars.GCP_DEV_PROJECT_ID }}
      DEV_REGISTRY: ${{ vars.GCP_DEV_REGISTRY }}
      OWNER: ${{ github.repository_owner }}
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      CLOUDSDK_RUN_REGION: ${{ vars.GCP_REGION }}

    steps:
      - name: Validate trusted dispatch
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/main || {
            echo "::error::Release dispatches must originate from main."
            exit 1
          }
          test "${GITHUB_RUN_ATTEMPT}" = 1 || {
            echo "::error::Release runs cannot be rerun; dispatch a new run from current main."
            exit 1
          }
          printf '%s' "${CONTROL_SHA}" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "::error::The workflow commit must be a full commit SHA."
            exit 1
          }
          for name in PROJECT_ID PROJECT_NUMBER REGION REGISTRY RUNTIME_SA_EMAIL ALLOWED_HOST GOOGLE_OAUTH_CLIENT_ID \
            DEV_PROJECT_ID DEV_REGISTRY; do
            test -n "${!name:-}" || { echo "::error::Missing release configuration: ${name}"; exit 1; }
          done

      # Always execute automation from the same protected commit that supplied
      # this workflow. Candidate images are payload, never executable scripts.
      - name: Checkout trusted release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require current remote main HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          test "${remote_sha}" = "${CONTROL_SHA}" || {
            echo "::error::Main advanced after dispatch; start a new release run."
            exit 1
          }

      - name: Google Auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: "${{ secrets.GCP_RELEASE_SA_KEY }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Validate retry source
        id: retry
        if: inputs.retry_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -z "${RELEASE_REF}" || { echo '::error::Choose release_ref or retry_run_id, not both.'; exit 1; }
          [[ "${RETRY_RUN_ID}" =~ ^[1-9][0-9]*$ ]] || { echo '::error::Invalid retry run ID.'; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RETRY_RUN_ID}" > "${RUNNER_TEMP}/retry-run.json"
          jq -e --arg repo "${GITHUB_REPOSITORY}" '
            .repository.full_name == $repo and
            .path == ".github/workflows/release-cloud-run.yml" and
            .event == "workflow_dispatch" and .head_branch == "main" and
            .status == "completed" and
            (.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")
          ' "${RUNNER_TEMP}/retry-run.json" > /dev/null
          source_sha=$(jq -er .head_sha "${RUNNER_TEMP}/retry-run.json")
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "${source_sha}" "${CONTROL_SHA}"
          printf 'control_sha=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Download original release plan
        if: inputs.retry_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-plan
          path: ${{ runner.temp }}/retry-plan
          run-id: ${{ inputs.retry_run_id }}
          github-token: ${{ github.token }}

      - name: Configure Registry auth
        run: gcloud auth configure-docker "${DEV_REGISTRY%%/*},${REGISTRY%%/*}" --quiet

      - name: Resolve and verify candidate digests
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_BUNDLE_FILE: ${{ inputs.retry_run_id != '' && format('{0}/retry-plan/plan.json', runner.temp) || '' }}
          RETRY_CONTROL_SHA: ${{ steps.retry.outputs.control_sha }}
        run: bash .github/scripts/release/resolve.sh

      - name: Checkout selected deployment data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.release_sha }}
          path: .release-source
          persist-credentials: false
          sparse-checkout: |
            deploy/cloud-run
            database/migration

      - name: Prepare all deployment templates
        env:
          SOURCE_DIR: ${{ github.workspace }}/.release-source
          MANIFEST_DIR: ${{ github.workspace }}/.release-data/manifests
          BUNDLE_FILE: ${{ steps.candidate.outputs.bundle_file }}
        run: |
          bash .github/scripts/release/render.sh
          cp "${BUNDLE_FILE}" .release-data/plan.json

      - name: Render and validate all deployment templates
        id: render
        uses: mikefarah/yq@c14f446382944492701b16c1ddb48bb9dbe683e3 # v4.53.6; upstream image pinned by digest
        env:
          MANIFEST_DIR: .release-data/manifests
          BUNDLE_FILE: .release-data/plan.json
          CLOUDFLARE_ORIGIN_SECRET: ${{ secrets.CLOUDFLARE_ORIGIN_SECRET }}
        with:
          cmd: sh .github/scripts/release/render-yaml.sh

      - name: Save fixed release plan
        id: save_plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-plan
          path: ${{ steps.candidate.outputs.bundle_file }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish planned images
        if: inputs.environment == 'prod'
        id: images
        uses: ./.github/actions/publish-images
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          tags: ${{ steps.candidate.outputs.sha_tags }}
          images: ${{ steps.candidate.outputs.bundle_file }}
          registry: ${{ env.REGISTRY }}
          project-id: ${{ env.PROJECT_ID }}

      - name: Set up Go for migrations
        if: inputs.run_migrations
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned Goose
        if: inputs.run_migrations
        run: |
          set -euo pipefail
          goose_version=$(make -s --no-print-directory print-goose-version)
          printf '%s' "${goose_version}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::Invalid Goose version from Makefile."
            exit 1
          }
          go install "github.com/pressly/goose/v3/cmd/goose@${goose_version}"

      - name: Read migration DSN
        id: migration_secret
        if: inputs.run_migrations
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3
        with:
          secrets: |-
            dsn:${{ env.PROJECT_ID }}/postgres-migration-dsn/latest
          export_to_environment: false

      - name: Apply selected candidate migrations
        id: migrations
        if: inputs.run_migrations
        env:
          SOURCE_DIR: ${{ github.workspace }}/.release-source
          PG_URI: ${{ steps.migration_secret.outputs.dsn }}
        run: |
          set -euo pipefail
          test -n "${PG_URI}" || { echo "::error::postgres-migration-dsn is empty."; exit 1; }
          case "${PG_URI}" in
            *$'\r'*|*$'\n'*)
              echo "::error::postgres-migration-dsn must not contain CR or LF."
              exit 1
              ;;
          esac
          if grep -Eq 'pooler\.supabase\.com' <<<"${PG_URI}" && grep -Eq '(:6543|port=6543)([^0-9]|$)' <<<"${PG_URI}"; then
            echo "::error::Migration DSN must use a direct or session connection."
            exit 1
          fi
          goose="$(go env GOPATH)/bin/goose"
          test -x "${goose}"
          PGOPTIONS='-c search_path=public,extensions' "${goose}" \
            -table goose_supabase_pre_version -dir "${SOURCE_DIR}/database/migration/supabase/pre" postgres "${PG_URI}" up
          PGOPTIONS='-c search_path=public,extensions' "${goose}" \
            -dir "${SOURCE_DIR}/database/migration/postgres" postgres "${PG_URI}" up
          PGOPTIONS='-c search_path=public,extensions' "${goose}" \
            -table goose_supabase_post_version -dir "${SOURCE_DIR}/database/migration/supabase/post" postgres "${PG_URI}" up
          unset PG_URI

      - name: Deploy geoworker
        id: deploy_geoworker
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          region: ${{ env.REGION }}
          metadata: ${{ github.workspace }}/.release-data/manifests/geoworker.yaml

      - name: Deploy device-cleanup
        id: deploy_device_cleanup
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          region: ${{ env.REGION }}
          metadata: ${{ github.workspace }}/.release-data/manifests/device-cleanup.yaml

      - name: Deploy radar
        id: deploy_radar
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          region: ${{ env.REGION }}
          metadata: ${{ github.workspace }}/.release-data/manifests/radar.yaml

      - name: Verify released digests and readiness
        id: verify
        env:
          BUNDLE_FILE: ${{ steps.candidate.outputs.bundle_file }}
          RADAR_URL: ${{ steps.deploy_radar.outputs.url }}
        run: bash .github/scripts/release/verify.sh

      - name: Write release summary
        if: always()
        env:
          RELEASE_SHA: ${{ steps.candidate.outputs.release_sha }}
          BUNDLE_FILE: ${{ steps.candidate.outputs.bundle_file }}
          PLAN_OUTCOME: ${{ steps.save_plan.outcome }}
        run: |
          {
            echo '## Cloud Run release'
            printf '\nEnvironment: `%s`\nRelease SHA: `%s`\nRun ID: `%s`\n' "${TARGET_ENVIRONMENT}" "${RELEASE_SHA}" "${GITHUB_RUN_ID}"
            printf 'Migrations requested: `%s`\n' "${RUN_MIGRATIONS}"
            if [ -n "${RETRY_RUN_ID}" ]; then
              printf 'Retry of run: `%s`\n' "${RETRY_RUN_ID}"
              original=$(jq -r '.run_migrations' "${RUNNER_TEMP}/retry-plan/plan.json" 2>/dev/null || printf unavailable)
              printf 'Original migration selection: `%s`\n' "${original}"
            fi
            if [ -n "${BUNDLE_FILE}" ] && [ -f "${BUNDLE_FILE}" ]; then
              echo '| Target | Image |'
              echo '| --- | --- |'
              jq -r '.images | to_entries[] | "| \(.key) | `\(.value)` |"' "${BUNDLE_FILE}"
            fi
            if [ "${PLAN_OUTCOME}" = success ]; then
              echo 'For a failed release, dispatch from current main with this retry run ID and explicitly select whether to run migrations.'
            else
              echo 'No release-plan artifact was saved; select a release reference in a new dispatch after fixing the failure.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove rendered deployment data
        if: always()
        run: rm -rf -- .release-data
